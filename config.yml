version: "1.0"
environment: "development"

ratelimit:
  enabled: true

home:
  message: "water bottle is starting..."

redis:
  provider: "redis"
  max_messages: 5
  ttl_seconds: 86400
  similarity_threshold: 0.90

cache:
  provider: "upstash"
  ttl_seconds: 604800                   # 7 days for vector responses
  similarity_threshold: 0.90

llm:
  provider: "gemini"
  model_name: "gemini-2.5-flash"
  temperature: 0.2
  max_tokens: 1024

embedding:
  provider: "gemini"
  model_name: "gemini-embedding-001"

qdrant:
  collection_name: "nmc"
  top_k: 5
  score_threshold: 0.6

rag:

auth:
  audience: "water-bottle"
  access_token_expire_minutes: 15
  refresh_token_expire_days: 7
  clients:
    - client_id: "water-bottle-client"
      tenant_id: "nmc"
      allowed_grant_types:
        - client_credentials
        - user_token
        - refresh_token

routers:
  home: true
  auth: true
  rag: true