embedder:
  type: gemini
  model_name: "gemini-embedding-001"
  task_type: "retrieval_query"

retriever:
  type: pinecone
  index_name: "nmc-index"  # Use our newly created index
  vector_field: "values"
  content_field: "metadata"

pinecone:
  api_key: ""  # Loaded from PINECONE_API_KEY environment variable

memory:
  type: session
  max_messages: 50

prompt:
  system_prompt: "You are a helpful AI assistant for Nehru Memorial College. Keep responses short, simple. Use the provided context to answer questions accurately. Only elaborate if specifically asked for details. If the context doesn't contain relevant information, say so politely."

generator:
  type: litellm
  model_name: "gemini/gemini-2.5-flash"
  api_key: ""  # Loaded from GEMINI_API_KEY environment variable
  temperature: 0.7
  max_tokens: 1200

elasticsearch:
  hosts: [""]  # Loaded from ELASTICSEARCH_URL environment variable
  options:
    basic_auth: ["", ""]  # Loaded from ELASTIC_USER and ELASTIC_PASSWORD environment variables
    verify_certs: false  # Loaded from ELASTIC_VERIFY_CERTS environment variable

telegram:
  bot_token: ""  # Loaded from TELEGRAM_BOT_TOKEN environment variable
  webhook_url: ""  # Loaded from TELEGRAM_WEBHOOK_URL environment variable
  bot_username: "One_Look_bot"