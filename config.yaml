embedder:
  type: gemini
  model_name: "gemini-embedding-001"
  task_type: "retrieval_query"

retriever:
  type: pinecone
  index_name: "nmc-index"  # Use our newly created index
  vector_field: "values"
  content_field: "metadata"

pinecone:
  api_key: ""  # Loaded from PINECONE_API_KEY environment variable

memory:
  type: window
  window_size: 10

prompt:
  system_prompt: "You are a helpful AI assistant for Nehru Memorial College. 
    Keep responses short, simple. Use the provided context to answer questions accurately. 
    Only elaborate if specifically asked for details. 
    If the context doesn't contain relevant information, say so politely.
    If user ask any contact details provide the contact details with list format.
    
    When user asks about departments or courses try to cover everything in a structured way."

generator:
  type: litellm
  model_name: "gemini/gemini-1.5-flash-lite"
  api_key: ""  # Loaded from GEMINI_API_KEY environment variable
  temperature: 0.7
  max_tokens: 1200

telegram:
  bot_token: ""  # Loaded from TELEGRAM_BOT_TOKEN environment variable
  webhook_url: ""  # Loaded from TELEGRAM_WEBHOOK_URL environment variable
  bot_username: "One_Look_bot" 