[project]
name = "water-bottle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
    "vertexai>=1.71.1",
]

[tool.pyright]
# tell pyright to explicitly look at the repo root
extraPaths = ["."]
# disable the automatic rule that skips the src folder
autoSearchPaths = false
