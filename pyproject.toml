[project]
name = "water-bottle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.75",
    "fastapi>=0.138.1",
    "llama-index>=0.14.24",
    "llama-index-embeddings-gemini>=0.4.2",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-readers-s3>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "locust>=2.46.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
    "vertexai>=1.71.1",
]

[tool.pyright]
# tell pyright to explicitly look at the repo root
extraPaths = ["."]
# disable the automatic rule that skips the src folder
autoSearchPaths = false
